<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>QuickNotes</h1>
      <p class="subtitle">API client demo using the JSONPlaceholder practice API</p>
    </header>

    <section aria-labelledby="load-heading">
      <h2 id="load-heading">Your notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="notes-list"></ul>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Add a note</h2>
      <form id="note-form" novalidate>
        <label for="title-input">Title (required, max 100 characters)</label>
        <input id="title-input" name="title" type="text" autocomplete="off">

        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" name="body" rows="4"></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>
  </main>
</body>
</html>
